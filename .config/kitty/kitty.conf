# ~/.config/kitty/kitty.conf
# kitty, set up to match ghostty/config (same font, features, colours, padding,
# keys). Reload after editing with Cmd+Shift+, (mapped below, like Ghostty) or
#   pkill -USR1 -x kitty
# All options with docs:  https://sw.kovidgoyal.net/kitty/conf/

# -- Font ----------------------------------------------------------------------
# The four font lines are managed by the `font` switcher (font.zsh): `font <name>`
# rewrites them here and in ghostty/config, then reloads kitty. Family names
# only; kitty picks the Bold/Italic faces itself.
font_family      Maple Mono NF
bold_font        Maple Mono NF
italic_font      Maple Mono NF
bold_italic_font Maple Mono NF
# 16pt suits a 27" 4K panel (~163 PPI); bump/drop to taste.
font_size 16.0
# Maple Mono OpenType features, the same set as ghostty/config (see the notes
# there): tag badges, extra ligatures, barred 7 / z, pipe arrows, dotted zero.
# kitty keys features by PostScript name, one line per face.
font_features MapleMono-NF-Regular    +calt +liga +ss03 +ss07 +ss08 +ss10 +ss11 +cv09 +cv43 +cv66 +zero
font_features MapleMono-NF-Bold       +calt +liga +ss03 +ss07 +ss08 +ss10 +ss11 +cv09 +cv43 +cv66 +zero
font_features MapleMono-NF-Italic     +calt +liga +ss03 +ss07 +ss08 +ss10 +ss11 +cv09 +cv43 +cv66 +zero
font_features MapleMono-NF-BoldItalic +calt +liga +ss03 +ss07 +ss08 +ss10 +ss11 +cv09 +cv43 +cv66 +zero
# No stroke thickening on a retina panel (ghostty: font-thicken = false).
macos_thicken_font 0
disable_ligatures never

# -- Theme & colours -----------------------------------------------------------
# theme.conf is generated by the `theme` shell command from the same Ghostty
# theme file Ghostty uses (colours, cursor, selection, tab bar, opacity), and
# every running kitty is reloaded. Don't edit it; run `theme <name>`.
include theme.conf
dynamic_background_opacity yes
background_blur 24

# -- Cursor --------------------------------------------------------------------
cursor_shape block
cursor_blink_interval 0
# Shell integration (prompt marks, cwd for new tabs, bar cursor at the prompt
# like Ghostty's `cursor` feature).
shell_integration enabled

# -- Window & tabs --------------------------------------------------------------
# ghostty: window-padding-x = 14, window-padding-y = 12  (kitty: vertical horizontal)
window_padding_width 12 14
# Tabs across the top in place of a title bar (ghostty: macos-titlebar-style = tabs).
hide_window_decorations titlebar-only
macos_show_window_title_in none
tab_bar_edge top
tab_bar_style powerline
tab_powerline_style slanted
tab_title_template "{index} {title}"
mouse_hide_wait -1
copy_on_select clipboard
# kitty has no "restore windows" option; it remembers the last size instead.
remember_window_size yes

# -- macOS / keyboard ----------------------------------------------------------
# Left Option sends Alt so zsh word-motion bindings work; right Option keeps
# typing special characters.
macos_option_as_alt left

# -- Quality of life -----------------------------------------------------------
confirm_os_window_close 0
macos_quit_when_last_window_closed yes

# -- Keybindings (a few extras; defaults already cover most) --------------------
map cmd+shift+enter toggle_fullscreen
map cmd+k           combine : clear_terminal scrollback active : clear_terminal clear active
map cmd+shift+,     load_config_file
# Ghostty-style split and tab keys that kitty does not map by default. A kitty
# "window" is a pane inside a tab; an "OS window" is a macOS window.
# (no trailing comments on map lines: kitty would pass the "#" to the action)
# Cmd+D: pane to the right. Cmd+Shift+D: pane below (kitty's default close-pane
# key, moved to Cmd+W). Cmd+W: close the pane, the last one closes the tab.
# Cmd+Shift+Z: zoom the pane / back to splits.
map cmd+d           launch --location=vsplit --cwd=current
map cmd+shift+d     launch --location=hsplit --cwd=current
map cmd+w           close_window
map cmd+shift+w     close_tab
map cmd+shift+z     toggle_layout stack
map cmd+alt+left    neighboring_window left
map cmd+alt+right   neighboring_window right
map cmd+alt+up      neighboring_window up
map cmd+alt+down    neighboring_window down
map cmd+1           goto_tab 1
map cmd+2           goto_tab 2
map cmd+3           goto_tab 3
map cmd+4           goto_tab 4
map cmd+5           goto_tab 5
map cmd+6           goto_tab 6
map cmd+7           goto_tab 7
map cmd+8           goto_tab 8
map cmd+9           goto_tab 9
enabled_layouts splits,stack
