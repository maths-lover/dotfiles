"$schema" = 'https://starship.rs/config-schema.json'

# Tidy two-line prompt: FULL path + Nerd Font icons. Colours are ANSI palette
# roles (never hex) so the prompt follows the active terminal theme - see
# docs/07-prompt.md and the `theme` switcher. Needs a Nerd Font (Ghostty uses
# MonaspiceNe); every glyph below is verified present in that font.
#
# Local:   ~/dotfiles/.config/nvim   main !1 +5 -2   3.12             14:22
# SSH:    me@server 10.0.0.9   ~/src   main  ...
#         
#
# Prompt char by vim mode:  INSERT (green ok / red err) -  NORMAL -
#  VISUAL -  REPLACE (best-effort in zsh).

add_newline = true
command_timeout = 500
palette = 'theme'

format = """
$username$hostname$localip\
$directory\
$git_branch$git_commit$git_status$git_metrics$git_state\
$golang$rust$python$nodejs$zig$java$c$lua$ruby$php\
$direnv$container$docker_context$kubernetes\
$sudo$memory_usage$cmd_duration$jobs$status
$character"""

right_format = "$time"

# ANSI palette roles -> follow the terminal theme (see docs/08-themes.md).
[palettes.theme]
ok    = "bright-green"
err   = "bright-red"
warn  = "bright-yellow"
vim   = "bright-magenta"
muted = "bright-black"
dir   = "bright-blue"
git   = "bright-purple"
info  = "bright-cyan"

# Prompt character, distinct glyph per vim keymap (colour via palette roles).
[character]
success_symbol        = "[](bold ok)"
error_symbol          = "[](bold err)"
vimcmd_symbol         = "[](bold vim)"
vimcmd_visual_symbol  = "[](bold warn)"
vimcmd_replace_symbol = "[](bold err)"
vimcmd_replace_one_symbol = "[](bold err)"

# -- Identity: only over SSH (user@host + LAN IP); username also shows as root -
[username]
show_always = false
style_user = "bold warn"
style_root = "bold err"
format = "[$user]($style)"

[hostname]
ssh_only = true
style = "bold info"
format = "[@$hostname]($style) "

[localip]
disabled = false
ssh_only = true
style = "muted"
format = "[$localipv4]($style) "

# Full path, always: no truncation, not clipped to the repo root, ~ for $HOME.
[directory]
truncation_length = 0
truncate_to_repo = false
truncation_symbol = ""
home_symbol = "~"
style = "bold dir"
read_only = " 󰌾"
read_only_style = "bold err"
format = "[ ]($style)[$path]($style)([$read_only]($read_only_style))"

[git_branch]
symbol = ""
style = "bold git"
format = "[ $symbol $branch]($style)"

# Short hash (+ tag) - only on a detached HEAD.
[git_commit]
only_detached = true
tag_disabled = false
tag_symbol = "  "
commit_hash_length = 7
style = "muted"
format = '[ \($hash$tag\)]($style)'

[git_status]
style = "bold err"
format = "([ $all_status$ahead_behind]($style))"
modified   = "!$count"
staged     = "+$count"
untracked  = "?$count"
stashed    = "*$count"
deleted    = "x$count"
renamed    = "»$count"
conflicted = "=$count"
ahead    = "$count"
behind   = "$count"
diverged = "$ahead_count $behind_count"

# Diff line counts: +added (green) / -deleted (red), only when non-zero.
[git_metrics]
disabled = false
added_style = "bold ok"
deleted_style = "bold err"
format = "([ +$added]($added_style))([ -$deleted]($deleted_style))"

# In-progress git op: rebase / merge / cherry-pick / bisect (+ step count).
[git_state]
style = "bold warn"
format = "[ $state( $progress_current/$progress_total)]($style)"
rebase = "rebase"
merge = "merge"
revert = "revert"
cherry_pick = "cherry"
bisect = "bisect"
am = "am"
am_or_rebase = "am/rebase"

# -- Languages: coloured icon + muted version, only inside a matching project --
[golang]
symbol = ""
version_format = "$raw"
style = "info"
format = "[ $symbol ]($style)[$version](muted)"

[rust]
symbol = "󱘗"
version_format = "$raw"
style = "info"
format = "[ $symbol ]($style)[$version](muted)"

[python]
symbol = ""
version_format = "$raw"
style = "info"
format = "[ $symbol ]($style)[$version](muted)[ ($virtualenv)](muted)"

[nodejs]
symbol = ""
version_format = "$raw"
style = "info"
format = "[ $symbol ]($style)[$version](muted)"

[zig]
symbol = ""
version_format = "$raw"
style = "info"
format = "[ $symbol ]($style)[$version](muted)"

[java]
symbol = ""
version_format = "$raw"
style = "info"
format = "[ $symbol ]($style)[$version](muted)"

[c]
symbol = ""
version_format = "$raw"
style = "info"
format = "[ $symbol ]($style)[$version](muted)"

[lua]
symbol = ""
version_format = "$raw"
style = "info"
format = "[ $symbol ]($style)[$version](muted)"

[ruby]
symbol = ""
version_format = "$raw"
style = "info"
format = "[ $symbol ]($style)[$version](muted)"

[php]
symbol = ""
version_format = "$raw"
style = "info"
format = "[ $symbol ]($style)[$version](muted)"

# -- Env / infra: direnv, container, docker context, kube context -------------
[direnv]
disabled = false
symbol = ""
style = "info"
format = "[ $symbol]($style)"

[container]
symbol = ""
style = "warn"
format = "[ $symbol ]($style)[$name](muted)"

[docker_context]
symbol = ""
only_with_files = true
style = "info"
format = "[ $symbol ]($style)[$context](muted)"

[kubernetes]
disabled = false
symbol = "󱃾"
style = "info"
format = "[ $symbol ]($style)[$context](muted)"

# -- Transients: sudo, memory (>75%), duration, jobs, exit status -------------
[sudo]
disabled = false
symbol = ""
style = "warn"
format = "[ $symbol]($style)"

[memory_usage]
disabled = false
threshold = 75
symbol = "󰍛"
style = "warn"
format = "[ $symbol $ram_pct]($style)"

[cmd_duration]
min_time = 2000
style = "warn"
format = "[  $duration]($style)"

[jobs]
number_threshold = 1
symbol = ""
style = "info"
format = "[ $symbol $number]($style)"

# Exit status: per-pipe codes + signal names (SIGINT, ...), only on failure.
[status]
disabled = false
pipestatus = true
pipestatus_separator = " | "
recognize_signal_code = true
map_symbol = false
symbol = ""
signal_symbol = ""
style = "bold err"
format = "[ $symbol $common_meaning$signal_name$maybe_int]($style)"
pipestatus_format = "[$pipestatus]($style)"

[time]
disabled = false
time_format = "%H:%M"
style = "muted"
format = "[ $time]($style)"
