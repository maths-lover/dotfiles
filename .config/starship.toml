"$schema" = 'https://starship.rs/config-schema.json'

format = """
[╭](fg:current_line)\
$os\
$directory\
$git_branch\
$git_status\
$git_commit\
$git_state\
$git_metrics\
$fill\
$nodejs\
$dotnet\
$python\
$java\
$lua\
$golang\
$c\
$cmd_duration\
$jobs\
$status\
$shell\
$time\
$username\
$line_break\
$character\
"""

palette = 'theme'
add_newline = true

# ANSI palette roles -> follow the active Ghostty theme (no hex). Neutrals:
# box/current_line = a grey panel/line; primary = symbol on a bright accent cap;
# body text uses the terminal's default foreground.
[palettes.theme]
foreground = 'white'
background = 'black'
current_line = 'bright-black'
primary = 'black'
box = 'bright-black'
blue = 'bright-blue'
cyan = 'bright-cyan'
green = 'bright-green'
orange = 'bright-yellow'
pink = 'bright-purple'
purple = 'bright-purple'
red = 'bright-red'
yellow = 'bright-yellow'

[os]
format = '(fg:current_line)[](fg:orange)[$symbol ](fg:primary bg:orange)[](fg:orange)'
disabled = false

[os.symbols]
Alpine = ''
Amazon = ''
Android = ''
Arch = ''
CentOS = ''
Debian = ''
EndeavourOS = ''
Fedora = ''
FreeBSD = ''
Garuda = ''
Gentoo = ''
Linux = ''
Macos = ''
Manjaro = ''
Mariner = ''
Mint = ''
NetBSD = ''
NixOS = ''
OpenBSD = ''
OpenCloudOS = ''
openEuler = ''
openSUSE = ''
OracleLinux = '⊂⊃'
Pop = ''
Raspbian = ''
Redhat = ''
RedHatEnterprise = ''
Solus = ''
SUSE = ''
Ubuntu = ''
Unknown = ''
Windows = ''



[directory]
format = '[─](fg:current_line)[](fg:green)[ ](fg:primary bg:green)[](fg:green bg:box)[ $read_only$truncation_symbol$path](bg:box)[](fg:box)'
home_symbol = "󰉌 "
truncation_symbol = ' '
truncation_length = 2
read_only = '󱧴 '
read_only_style = ''

[directory.substitutions]
"Documents" = "󰈙"
"Downloads" = " "
"Music" = "󰝚 "
"Pictures" = " "
"Develop" = "󰲋 "
"develop" = "󰲋 "

[git_branch]
format = '[─](fg:current_line)[](fg:cyan)[$symbol](fg:primary bg:cyan)[](fg:cyan bg:box)[ $branch](bg:box)[](fg:box bg:yellow)'
symbol = ''

[git_status]
disabled = false
format = '[( $all_status $ahead_behind)](fg:primary bg:yellow)[](fg:yellow bg:pink)'
conflicted = ' '
stashed = ' '
deleted = ' '
renamed = '󰑕 '
modified = ' '
typechanged = '󰕁 '
staged = '$count: '
untracked = '$count: '
diverged = ' $ahead_count $behind_count '
ahead = '$count: '
behind = '$count: '
up_to_date = ' '

[git_commit]
commit_hash_length = 5
tag_symbol = ' '
format = '[  $hash $tag](fg:primary bg:pink)[](fg:pink)'
disabled = false
only_detached = false
tag_disabled = false

[git_state]
disabled = false
format = '[─](fg:current_line)[](fg:red)[$state ](fg:primary bg:red)[$progress_current/$progress_total](fg:primary bg:red)[](fg:red)'
rebase = ''
merge = ''
revert = '󰕌'
cherry_pick = ''
bisect = ''
am = ''
am_or_rebase = ' or '

[nodejs]
format = '[─](fg:current_line)[](fg:green)[$symbol](fg:primary bg:green)[](fg:green bg:box)[ $version](bg:box)[](fg:box)'
symbol = '󰎙 Node.js'

[dotnet]
format = '[─](fg:current_line)[](fg:purple)[$symbol](fg:primary bg:purple)[](fg:purple bg:box)[ $tfm](bg:box)[](fg:box)'
symbol = ' .NET'

[python]
format = '[─](fg:current_line)[](fg:cyan)[$symbol](fg:primary bg:cyan)[](fg:cyan bg:box)[ $version](bg:box)[](fg:box)'
symbol = ' python'

[java]
format = '[─](fg:current_line)[](fg:red)[$symbol](fg:primary bg:red)[](fg:red bg:box)[ $version](bg:box)[](fg:box)'
symbol = ' Java'

[lua]
format = '[─](fg:current_line)[](fg:blue)[$symbol](fg:primary bg:blue)[](fg:blue bg:box)[ $version](bg:box)[](fg:box)'
symbol = ' Lua'

[golang]
format = '[─](fg:current_line)[](fg:cyan)[$symbol](fg:primary bg:cyan)[](fg:cyan bg:box)[ $version](bg:box)[](fg:box)'
symbol = ' Go'

[c]
format = '[─](fg:current_line)[](fg:blue)[$symbol](fg:primary bg:blue)[](fg:blue bg:box)[ $version](bg:box)[](fg:box)'
symbol = ' C'

[rust]
format = '[─](fg:current_line)[](fg:red)[$symbol](fg:primary bg:red)[](fg:red bg:box)[ $version](bg:box)[](fg:box)'
symbol = ' Rust'

[zig]
format = '[─](fg:current_line)[](fg:yellow)[$symbol](fg:primary bg:yellow)[](fg:yellow bg:box)[ $version](bg:box)[](fg:box)'
symbol = ' Rust'

[fill]
symbol = '─'
style = 'fg:current_line'

[cmd_duration]
min_time = 500
format = '[─](fg:current_line)[](fg:orange)[ ](fg:primary bg:orange)[](fg:orange bg:box)[ $duration ](bg:box)[](fg:box)'

[shell]
format = '[─](fg:current_line)[](fg:purple)[ ](fg:primary bg:purple)[](fg:purple bg:box)[ $indicator](bg:box)[](fg:box)'
unknown_indicator = 'shell'
powershell_indicator = 'powershell'
fish_indicator = 'fish'
disabled = false

[time]
format = '[─](fg:current_line)[](fg:purple)[󰦖 ](fg:primary bg:purple)[](fg:purple bg:box)[ $time](bg:box)[](fg:box)'
time_format = '%H:%M'
disabled = true

[username]
format = '[─](fg:current_line)[](fg:yellow)[ ](fg:primary bg:yellow)[](fg:yellow bg:box)[ $user](bg:box)[](fg:box) '
show_always = true

[character]
format = """
[╰─$symbol](fg:current_line) """
success_symbol = '[❯](fg:bold green)'
error_symbol = '[×](fg:bold red)'

[git_metrics]
disabled = false
added_style = 'fg:green bg:box'
deleted_style = 'fg:red bg:box'
format = '([─](fg:current_line)[](fg:green)[ ](fg:primary bg:green)[](fg:green bg:box)([+$added ]($added_style))([-$deleted ]($deleted_style))[](fg:box))'

[jobs]
disabled = false
number_threshold = 1
symbol = ''
format = '[─](fg:current_line)[](fg:cyan)[ ](fg:primary bg:cyan)[](fg:cyan bg:box)[ $number](bg:box)[](fg:box)'

[status]
disabled = false
pipestatus = true
pipestatus_separator = ' | '
recognize_signal_code = true
map_symbol = false
symbol = ''
format = '[─](fg:current_line)[](fg:red)[ $common_meaning$signal_name$maybe_int ](fg:primary bg:red)[](fg:red)'
pipestatus_format = '[─](fg:current_line)[](fg:red)[ $pipestatus ](fg:primary bg:red)[](fg:red)'
