"$schema" = 'https://starship.rs/config-schema.json'

# Plain fallback prompt for bare TTYs (TERM=linux) and SSH sessions, selected
# automatically by .zshrc when Nerd Font glyphs / powerline pills can't be
# trusted to render. The fancy powerline version lives in starship.toml.
#
# Still theme-aware: colours are ANSI palette roles (never hex), so it follows
# whatever 16-colour palette the terminal has. Every glyph here is plain ASCII,
# so it degrades cleanly on a Linux virtual console or a minimal remote shell.

add_newline = true
command_timeout = 500
palette = 'theme'

format = """
$username$hostname$localip\
$directory\
$git_branch$git_commit$git_status$git_metrics$git_state\
$nodejs$dotnet$python$java$lua$golang$c$package\
$direnv$container$docker_context$kubernetes\
$sudo$memory_usage$cmd_duration$jobs$status
$character"""

right_format = "$time"

# Same ANSI palette roles as the powerline config (follow the terminal theme).
[palettes.theme]
ok    = "bright-green"
err   = "bright-red"
warn  = "bright-yellow"
vim   = "bright-purple"
muted = "bright-black"
dir   = "bright-blue"
git   = "bright-purple"
info  = "bright-cyan"

# ASCII prompt character per vim mode (no math glyphs on a bare TTY).
[character]
success_symbol            = "[>](bold ok)"
error_symbol              = "[>](bold err)"
vimcmd_symbol             = "[<](bold vim)"
vimcmd_visual_symbol      = "[<](bold warn)"
vimcmd_replace_symbol     = "[<](bold err)"
vimcmd_replace_one_symbol = "[<](bold err)"

# -- Identity: user@host + LAN IP (mainly seen here, since SSH uses this config)
[username]
show_always = false
style_user = "bold warn"
style_root = "bold err"
format = "[$user]($style)"

[hostname]
ssh_only = true
style = "bold info"
format = "[@$hostname]($style) "

[localip]
disabled = false
ssh_only = true
style = "muted"
format = "[$localipv4]($style) "

# Full path, never truncated, ~ for $HOME. No folder icons (ASCII only).
[directory]
truncation_length = 0
truncate_to_repo = false
truncation_symbol = ""
home_symbol = "~"
style = "bold dir"
read_only = " [ro]"
read_only_style = "bold err"
format = "[$path]($style)([$read_only]($read_only_style)) "

[git_branch]
symbol = ""
style = "bold git"
format = "[$branch]($style)"

[git_commit]
only_detached = true
tag_disabled = false
commit_hash_length = 7
style = "muted"
format = '[ \($hash$tag\)]($style)'

# ASCII status letters: !modified +staged ?untracked *stashed x deleted
# r renamed = conflicted; >n ahead / <n behind the remote.
[git_status]
style = "bold err"
format = "([ $all_status$ahead_behind]($style))"
modified   = "!$count"
staged     = "+$count"
untracked  = "?$count"
stashed    = "*$count"
deleted    = "x$count"
renamed    = "r$count"
conflicted = "=$count"
ahead    = ">$count"
behind   = "<$count"
diverged = "<>$ahead_count/$behind_count"

[git_metrics]
disabled = false
added_style = "bold ok"
deleted_style = "bold err"
format = "([ +$added]($added_style))([ -$deleted]($deleted_style))"

[git_state]
style = "bold warn"
format = "[ $state( $progress_current/$progress_total)]($style)"
rebase = "rebase"
merge = "merge"
revert = "revert"
cherry_pick = "cherry"
bisect = "bisect"
am = "am"
am_or_rebase = "am/rebase"

# -- Languages: short text tag + version, only inside a matching project -------
[golang]
symbol = "go "
version_format = "$raw"
style = "info"
format = "[ $symbol]($style)[$version](muted)"

[dotnet]
symbol = "dotnet "
version_format = "$raw"
style = "info"
format = "[ $symbol]($style)[$tfm](muted)"

[package]
disabled = false
symbol = "pkg "
version_format = "$raw"
style = "info"
format = "[ $symbol]($style)[$version](muted)"

[python]
symbol = "py "
version_format = "$raw"
style = "info"
format = "[ $symbol]($style)[$version](muted)[ ($virtualenv)](muted)"

[nodejs]
symbol = "node "
version_format = "$raw"
style = "info"
format = "[ $symbol]($style)[$version](muted)"

[java]
symbol = "java "
version_format = "$raw"
style = "info"
format = "[ $symbol]($style)[$version](muted)"

[c]
symbol = "c "
version_format = "$raw"
style = "info"
format = "[ $symbol]($style)[$version](muted)"

[lua]
symbol = "lua "
version_format = "$raw"
style = "info"
format = "[ $symbol]($style)[$version](muted)"

# -- Env / infra (plain text tags) ---------------------------------------------
[direnv]
disabled = false
symbol = "env"
style = "info"
format = "[ $symbol]($style)"

[container]
symbol = "box"
style = "warn"
format = "[ $symbol ]($style)[$name](muted)"

[docker_context]
symbol = "docker"
only_with_files = true
style = "info"
format = "[ $symbol ]($style)[$context](muted)"

[kubernetes]
disabled = false
symbol = "k8s"
style = "info"
format = "[ $symbol ]($style)[$context](muted)"

# -- Transients ----------------------------------------------------------------
[sudo]
disabled = false
symbol = "sudo"
style = "warn"
format = "[ $symbol]($style)"

[memory_usage]
disabled = false
threshold = 75
symbol = "mem"
style = "warn"
format = "[ $symbol $ram_pct]($style)"

[cmd_duration]
min_time = 2000
style = "warn"
format = "[ took $duration]($style)"

[jobs]
number_threshold = 1
symbol = "jobs"
style = "info"
format = "[ $symbol $number]($style)"

[status]
disabled = false
pipestatus = true
pipestatus_separator = " | "
recognize_signal_code = true
map_symbol = false
symbol = ""
signal_symbol = ""
style = "bold err"
format = "[ $common_meaning$signal_name$maybe_int]($style)"
pipestatus_format = "[$pipestatus]($style)"

[time]
disabled = false
time_format = "%H:%M"
style = "muted"
format = "[$time]($style)"
